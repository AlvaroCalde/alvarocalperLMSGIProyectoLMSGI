<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas.Álvaro Calderón</title>
    <style>
        header{
            background-color: aquamarine;
            color: white;
        }
        img{
            height: 13%;
            width: 13%;
            border: 1px solid black;
            border-radius: 10px;
            padding: 10px;
        }
        figcaption,figure{
            text-align: center;
        }
        figcaption{
            background-color: lightseagreen;
            color: white;
            padding-top: 5px;
            padding-bottom: 5px;
        }
        figure{
            border: 2px solid lightseagreen;
            padding: 10px;
            margin: 0;
            border-radius: 10px;
        }
        ol{
            width: 5%;
            margin:0 auto;
        }
        .negrita{
            font-weight: bold;
        }
        address{
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>Listas</h1>
    </header>
    <main>
        <ol>
            <li><span class="negrita">Hardware</span>
                <ul>
                    <li>Ratón</li>
                    <li>Pantalla</li>
                </ul>
            </li>
            
            <li><span class="negrita">Software</span>
                <ul>
                    <li>Office365</li>
                    <li>Visual Studio</li>
                </ul>  
            </li>
        </ol>
    </main>
    <figure>
        <img src="images/ratón.jpg" alt="Ratón de ordenador">  
        <img src="images/pantalla.jpg" alt="Pantalla de ordenador">      
        <img src="images/office.jpg" alt="Logo de Office365">
        <img src="images/vscode.jpg" alt="Logo de Visual Studio Code">
        <figcaption><b>Tecnologías</b></figcaption>
    </figure>
    <footer>
        <address>Copyright. Álvaro Calderón Pérez</address>
        
    </footer>
</body>
</html>
