<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ut2.5 Forms. Álvaro Calderón Pérez</title>
    <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
 
    #principal {
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
      width: 350px;
      box-sizing: border-box;
    }
 
    #textarea {
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      resize: vertical;
      min-height: 80px;
    }

    #enviar,#res {
      background-color: #4caf50;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      margin-top: 5px;
    }

    #ext,#tra,#tra2{
        background-color: #4caf50;
        accent-color: #4caf50;
        transform: scale(1.2);
        margin-right: 4px;
    }

  </style>
</head>
<body>
    <main>
        <form action="mostrar.php" method="get">
            <div id="principal">
                <div>
                <label for="marca">Marca *:</label>
                <br>
                <input id="marca" name="Nombre" required>
            </div>
            <div>
                <label for="mod">Modelo *:</label>
                <br>
                <input id="mod" name="modelo" required> 
            </div>
            <div>
                <label for="anyo">Año de fabricación *:</label>
                <br>
                <input type="number" id="anyo" name="año_de_fabricación" min="1900" max="2025" required> 
            </div>
            <label for="idcom">Tipo de combustible *:</label>
            <br>
                <select name="combustible" id="idcom" required>
                    <option value="gas">Gasolina</option>
                    <option value="diehib">Diesel</option>
                    <option value="diehib">Híbrido</option>
                    <option value="elec">Eléctrico</option>
                </select>
            <div>
                <br>
                <label for="col">Color :</label>
                <input type="color" id="col" name="color"> 
            </div>
            <div>
                <br>
                <label for="kil">Kilometraje :</label>
                <input type="text" id="kil" name="kilometraje" min="0"> 
            </div>
            <div>
                <label for="tran">Transmisión :</label>
                <div>
                    <input type="radio" name="transmision" id="tra">
                    <label for="tra">Automática</label> 
                </div>
                <div>
                    <input type="radio" name="transmision" id="tra2">
                    <label for="tra2">Manual</label>
                </div>
            </div>
            <div>
                <label for="ext">Extras :</label>
                <div>
                    <input type="checkbox" name="extra" id="ext">
                    <label for="ext">Tiene extras</label> 
                </div>
            </div>
            <div>
                <label for="idob">Observaciones</label>
                <br>
                <textarea cols="40" rows="5" name="obs" id="idob" id="textarea"></textarea>
            </div>
            <div>
                <input type="submit" value="Enviar" id="enviar">
                <input type="reset" value="Restablecer"id="res">
            </div>
            </div>
            
        </form>
    </main>
</body>
</html>
