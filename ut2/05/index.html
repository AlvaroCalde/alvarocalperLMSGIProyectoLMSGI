<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ut2 05 Álvaro Calderón Pérez</title>
    <link rel="icon" type="image/jpg" href="/webroot/favicon/logo_BC.jpg">
    <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 150px;
    }

    form{
       max-width: 400px; 
       background-color: #fff;
       padding: 20px;
       border-radius: 8px;
       box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
       box-sizing: border-box;
    }
 
    textarea {
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      resize: vertical;
      min-height: 80px;
      width: fit-content;
    }

    input[type="submit"],
    input[type="reset"]{
      background-color: #4caf50;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      margin-top: 5px;
    }

    input[type="text"],
    input[type="number"]{
        width: 100%;
    }

    input[type="radio"],
    input[type="checkbox"]{
        accent-color: #4caf50;
        margin-right: 4px;
    }

    input:hover{
        background-color: lightgrey;
    }

    input[required]:hover{
        background-color: lemonchiffon;
    }

  </style>
</head>
<body>
    <main>
        <form action="mostrar.php" method="get">
            <div id="principal">
                <div>
                <label for="marca">Marca *:</label>
                <br>
                <input id="marca" name="Nombre" type="text" required>
            </div>
            <div>
                <label for="mod">Modelo *:</label>
                <br>
                <input id="mod" name="modelo" type="text" required> 
            </div>
            <div>
                <label for="anyo">Año de fabricación *:</label>
                <br>
                <input type="number" id="anyo" name="año_de_fabricación" min="1900" max="2025" required> 
            </div>
            <label for="idcom">Tipo de combustible *:</label><br>
                <select name="combustible" id="idcom" required>
                    <option value="">Gasolina</option>
                    <option value="diesel">Diesel</option>
                    <option value="hibrido">Híbrido</option>
                    <option value="electrico">Eléctrico</option>
                </select>
            <div>
                
                <label for="col">Color :</label><br>
                <input type="color" id="col" name="color"> 
            </div>
            <div>
                <label for="kil">Kilometraje :</label>
                <input type="number" id="kil" name="kilometraje" min="0"> 
            </div>
            <div>
                <div>Transmisión :</div>
                <div>
                    <input type="radio" name="transmision" id="tra">
                    <label for="tra">Automática</label> 
                </div>
                <div>
                    <input type="radio" name="transmision" id="tra2">
                    <label for="tra2">Manual</label>
                </div>
            </div>
            <div>
                <label for="ext">Extras :</label>
                <div>
                    <input type="checkbox" name="extra" id="ext">
                    <label for="ext">Tiene extras</label> 
                </div>
            </div>
            <div>
                <label for="textarea">Comentarios adicionales:</label>
                <br>
                <textarea cols="40" rows="5" name="obs" id="textarea"></textarea>
            </div>
            <div>
                <input type="submit" value="Enviar" id="enviar" >
                <input type="reset" value="Restablecer" id="reset" >
            </div>
            </div>
            
        </form>
    </main>
    
</body>
</html>
