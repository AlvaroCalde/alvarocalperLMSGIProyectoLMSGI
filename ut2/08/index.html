    <style>
        main{
            display: grid;
            grid-template-rows: auto auto;
            grid-template-columns: 250px repeat(3,2fr);
            border-top: 1px solid black;
            border-bottom: 1px solid black;
            margin-bottom: 100px;
        }
        header{
            grid-column: 1/4;
            text-align: center;
        }
        figure{
            display: inline-block;
            margin: 3px;
            border: 1px solid black;
            padding: 5px;
            border-radius: 5px;
        }
        figure img{
            border-radius: 5px;
        }
        figcaption{
            width: 300px;
        }
        .fecha{
            color: rgb(100, 100, 100);
            font-size: small;
        }
        aside{
            grid-row: 1/4;
        }
        img{
            width: 300px;
        }
        footer a img{
            width: 50px;
        }
        footer{
            grid-column: 1/4;
            text-align: center;
            color: white;
            background-color: black;
            padding: 20px;
        }
        #vali,#nombre{
            color: white;
        }
    </style>
</head>
