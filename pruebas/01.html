<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #contenedor div{
            border: 1px solid green;
        }
        #contenedor{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            grid-template-rows: repeat(4,1fr);
        }
        #cajaA{
            grid-column: 1/5;
        }
        #cajaI{
            grid-column: 1/5;
        }
        #cajaB{
            grid-row: 2/4;
        }
        #cajaC{
            grid-area: 2/2/4/4;
        }
    </style>
</head>
<body>
    <div id="contenedor">
        <div id="cajaA">A</div>
        <div id="cajaB">B</div>
        <div id="cajaC">C</div>
        <div>D</div>
        <div>E</div>
        <div>F</div>
        <div>G</div>
        <div>H</div>
        <div id="cajaI">I</div>
    </div>
</body>
</html>
